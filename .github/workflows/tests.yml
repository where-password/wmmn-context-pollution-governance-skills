name: tests
on: [push, pull_request]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install "pydantic>=2,<3" pytest
      - name: Prepare test workspace
        shell: bash
        run: mkdir -p work
      - name: Memory Core tests
        shell: bash
        run: PYTHONPATH=memory_core_v1/src python -m pytest -q -o addopts="" --basetemp "$RUNNER_TEMP/pytest-memory" memory_core_v1/tests
      - name: Cleaner tests
        shell: bash
        run: PYTHONPATH=memory_core_v1/src python -m unittest discover -s skills/conversation-context-cleaner/tests -p 'test_*.py' -q
      - name: Database tests
        shell: bash
        run: PYTHONPATH=skills/database-installer-core/scripts:skills/database-installer-core/vendor MEMORY_CORE_SRC= python -m pytest -q -o addopts="" --basetemp "$RUNNER_TEMP/pytest-db" skills/database-installer-core/tests
      - name: Validate Skill structure
        shell: bash
        run: python scripts/validate_skills.py .
      - name: Build release archives
        shell: bash
        run: python scripts/package_skills.py
  package:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install "pydantic>=2,<3"
      - run: python scripts/package_skills.py
      - uses: actions/upload-artifact@v5
        with: {name: skill-release-archives, path: release/*.zip}
